[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "logdeck"
version = "0.1.0"
description = "Log analyzer frontend: shared HTML report deck (tabs, tables, highlighting, viewer JS)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Roberto Etcheverry" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "pytest-cov",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/logdeck"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
explicit_package_bases = true
